bot:
  name:            # 机器人用户名（不带 @）
  token:           # BotFather 下发的 token
  owner:           # 拥有者 user id，0 表示不限制
  group_id:        # ★ 本机器人服务的群 id，群里的查询与推送都以此为准
  msg_del_delay: 10 # /ping 回复和无参数查询按钮的删除延迟（秒），0 使用默认 10 秒
  debug: false

api:
  client: hd2_bot          # 上游要求的 X-Super-Client
  contact:                 # 上游要求的 X-Super-Contact，必填，填你自己的联系方式
  user_agent: hd2_bot/0.1
  timeout: 30              # 单次请求超时（秒）
  base_helldivers: https://api.helldivers2.dev/api/v1
  base_companion: https://helldiverscompanion.com/api

cache:
  war_ttl: 60           # 战况缓存（秒）
  planets_ttl: 60       # 星球列表缓存（秒）
  campaigns_ttl: 120
  assignments_ttl: 300  # 重要指令
  dispatches_ttl: 600   # 战役简报
  events_ttl: 300       # 星球事件
  stations_ttl: 120     # 民主空间站
  effects_ttl: 300     # 行动变量（补充源，只在单星球卡上展示）

limit:
  rate: 4             # 每个窗口允许的请求数（上游实测上限 5 次/分钟/IP，留余量）
  reserve: 1          # 只留给用户命令的额度：定时推送最多用 rate-reserve 个，0 = 不预留
  window: 60          # 窗口秒数：上游是「5 次/分钟/IP」，这里必须写 60
  cooldown: 20        # 收到 429 后的默认冷却秒数
  retry_max: 3        # 5xx / 网络错误的最大尝试次数
  retry_base: 5       # 退避起始秒数
  retry_max_delay: 45 # 退避上限秒数

http:
  host: 127.0.0.1
  port: 25555

render:
  enabled: true    # 关闭后所有命令直接走纯文本
  width: 900       # 卡片 CSS 宽度（px）
  scale: 2         # 设备缩放，2 = 二倍图
  timeout: 15      # 单张渲染超时（秒）
  format: png      # png | jpeg


translate:
  enabled: true              # 关掉后所有正文保持英文
  mode: auto                 # auto=填了 api_url 就走 OpenAI 兼容接口、否则走 free_api_url；openai / free 为强制指定
  api_url: ""                # OpenAI 兼容地址（例如 https://api.openai.com/v1），auto 下留空即走免费接口
  api_key: ""                # 复制本文件到 hd2.yaml 后再填（hd2.yaml 已被 .gitignore 忽略，不进仓库、不进日志）
  model: gpt-4o-mini         # OpenAI 兼容后端使用的模型名
  target_lang: zh-CN
  timeout: 20                # 单次请求超时（秒）；慢速模型可调大
  max_tokens: 1200           # 译文输出上限，防免费模型自行加戏
  min_interval: 0            # 相邻请求最小间隔，只写整数秒（3 次/分钟就填 20）；写小数会被截断成整数秒，需要亚秒粒度得改字段类型
  error_cooldown: 120        # 429/5xx 后的冷却，只写整数秒；写小数会被截断（0.4 会变成 0＝完全不冷却）
  free_api_url: https://uapis.cn/api/v1/ai/translate  # 走 free 链路时，待翻译的上游正文会原样发给这个第三方免费接口

arsenal:
  dir: data/arsenal           # 装备目录与装备图的缓存目录（相对进程工作目录）
  ttl: 86400                  # 目录缓存有效期（秒）；上游一天一更
  timeout: 30                 # 单次下载超时（秒）
  source: helldivers-api      # 数据源：helldivers-api（默认，社区每天自动抓 wiki.gg）或 hd2tool（已停更的静态目录）
  api_base: https://helldivers-api.dionatha.com.br  # helldivers-api 的站点地址，自建镜像时改这里
  zh_wiki: https://jerry114514.github.io/HD2_Wiki/data/wiki/zh  # 补中文名的术语表地址；填 "-" 表示不拉，只用内置中文名表
  zh_names: ""                # 本地中文名覆盖表（id → 中文名），留空用 data/arsenal/zh-names.local.json
  mirror: https://gh-proxy.org/  # 只在 source=hd2tool 时生效的 GitHub 镜像前缀；填 "-" 表示不用镜像

bestiary:
  dir: data/bestiary          # 敌人图鉴的缓存目录
  ttl: 86400                  # 图鉴缓存有效期（秒）
  timeout: 20                  # 单次请求超时（秒）
  wiki_api: https://helldivers.wiki.gg  # 敌人数据与图标的来源站点

push:
  enabled: true
  cron: "15 */5 * * * *"     # 与心跳（整 5 分钟）错开，避免同一秒并发取数
  max_items: 5               # 每节最多列几条

verify:                      # 入群验证（呼叫演练）：新成员按顺序点出战备的召唤指令
  enabled: false             # 总开关；关掉时一个处理器都不注册
  mode: direct               # direct＝群为「直接加入」走群内验证 | approval＝群为「申请加入」走私聊验证（没有自动档）
  challenge: code            # 验证形式：code＝呼叫演练（按顺序点召唤指令）；目前只有这一种
  show_answer: true          # true＝题面图上印出召唤指令（照抄即可）；false＝只给战备名，凭记忆点
  timeout: 180               # 验证超时（秒），超时按失败处理；最长 3600
  attempts: 1                # 允许点错的次数（0＝一次都不许错）
  failure: kick              # kick＝踢出（还能重新申请）| ban＝封禁
  skip_invited: true         # true＝被其它成员拉进群的人免验证；false＝不管谁拉的都要验证
  unban_delay: 60            # 踢出后隔多少秒解封（参考项目用 1 分钟）；0＝立刻解封
  welcome: true              # 通过验证后是否在群里发一条文本欢迎
  welcome_text: ""           # 自定义欢迎文案，可用 {mention}（@他）与 {name}（昵称）；留空用内置
  welcome_del_delay: 0       # 欢迎消息自动删除延迟（秒）；0＝不删
  ad_words: []               # 昵称/简介命中即拦；留空用内置表（TG 引流、加v、返佣、刷单…）
  audit_channel: 0           # 审计日志频道 id（把入群/踢出事件也发一份）；0＝只写日志
